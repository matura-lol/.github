<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161a"/>
      <stop offset="1" stop-color="#1c1f26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4c8dff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#232830" stroke-width="1" opacity="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- logo mark (from matura.lol favicon): blue rounded square + white magnifier -->
  <g transform="translate(60, 80)">
    <rect width="240" height="240" rx="60" fill="url(#accent)"/>
    <circle cx="114" cy="114" r="56" fill="none" stroke="#ffffff" stroke-width="26"/>
    <path d="M162 162 L214 214" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="352" y="205" font-family="Inter, 'Segoe UI', sans-serif" font-size="84" font-weight="700" fill="#e7e9ec">matura<tspan fill="#4c8dff">.lol</tspan></text>
  <text x="354" y="268" font-family="Inter, 'Segoe UI', sans-serif" font-size="30" fill="#9aa3ad">Największa wyszukiwarka zadań egzaminacyjnych CKE/OKE</text>
</svg>