<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161a"/>
      <stop offset="1" stop-color="#1c1f26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4c8dff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#232830" stroke-width="1" opacity="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- logo mark: EXACT favicon geometry (favicon.svg viewBox 0 0 64 64) scaled x3.5
       rect x2 y2 w60 h60 rx16 | circle cx28 cy28 r13 sw6 | path M38 38 L50 50 sw7 -->
  <g transform="translate(48,88) scale(3.5)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#accent)"/>
    <circle cx="28" cy="28" r="13" fill="none" stroke="#ffffff" stroke-width="6"/>
    <path d="M38 38 L50 50" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="322" y="185" font-family="Inter, 'Segoe UI', sans-serif" font-size="68" font-weight="700" fill="#e7e9ec">matura<tspan fill="#4c8dff">.lol</tspan></text>
  <!-- subtitle, two lines so it never clips on an 800px canvas -->
  <text x="324" y="244" font-family="Inter, 'Segoe UI', sans-serif" font-size="25" fill="#9aa3ad">Największa wyszukiwarka zadań</text>
  <text x="324" y="278" font-family="Inter, 'Segoe UI', sans-serif" font-size="25" fill="#9aa3ad">egzaminacyjnych CKE/OKE</text>
</svg>